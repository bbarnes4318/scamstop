# ScamStop block checks for OpenSIPS 3.x. Paste inside your initial-INVITE route,
# before relaying. Needs: loadmodule "cachedb_redis.so"
#   modparam("cachedb_redis", "cachedb_url", "redis:sbc://127.0.0.1:6379/0")
# The dialog module must be loaded and the call created with create_dialog()
# so ScamStop can list and end it. Media must pass through rtpengine.

# Do-not-call destinations (e.g. victims who complained): SADD sbc:dnc 2025550123
cache_raw_query("redis:sbc", "SISMEMBER sbc:dnc $rU", "$avp(dnc)");
if ($avp(dnc) == 1) {
    xlog("L_WARN", "SCAMSTOP-REJECT reason=DNC dst=$rU src=$si\n");
    send_reply(403, "Destination Not Permitted");
    exit;
}

# Dialer account tags (Call-ID prefix like CNX33890_) for hosted dialers
if ($ci =~ "^CNX[0-9]+_") {
    $var(ctag) = $(ci{re.subst,/^(CNX[0-9]+)_.*$/\1/});
    cache_raw_query("redis:sbc", "SISMEMBER sbc:block:tag $var(ctag)", "$avp(btag)");
    if ($avp(btag) == 1) {
        xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CENTER tag=$var(ctag) dst=$rU src=$si\n");
        send_reply(403, "Forbidden");
        exit;
    }
}

# Media IP from the SDP c= line
if (has_body("application/sdp")) {
    $var(cip) = "";
    $var(nc) = "c=IN IP4 ";
    $var(e) = $(rb{s.index,$var(nc)});
    if ($var(e) >= 0) {
        $var(e) = $var(e) + $(var(nc){s.len});
        $var(cip) = $(rb{s.substr,$var(e),15});
        $var(cr) = "\r";
        $var(e) = $(var(cip){s.index,$var(cr)});
        if ($var(e) > 0) $var(cip) = $(var(cip){s.substr,0,$var(e)});
        $var(cr) = "\n";
        $var(e) = $(var(cip){s.index,$var(cr)});
        if ($var(e) > 0) $var(cip) = $(var(cip){s.substr,0,$var(e)});
    }
    if ($var(cip) =~ "^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$") {
        cache_raw_query("redis:sbc", "SISMEMBER sbc:block:media $var(cip)", "$avp(bmed)");
        if ($avp(bmed) == 1) {
            xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CENTER media=$var(cip) dst=$rU src=$si\n");
            send_reply(403, "Forbidden");
            exit;
        }
    }
}

# Call-ID origin host
if ($ci =~ "@[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+") {
    $var(chost) = $(ci{re.subst,/^[^@]*@([0-9.]+).*$/\1/});
    cache_raw_query("redis:sbc", "SISMEMBER sbc:block:host $var(chost)", "$avp(bhost)");
    if ($avp(bhost) == 1) {
        xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CENTER host=$var(chost) dst=$rU src=$si\n");
        send_reply(403, "Forbidden");
        exit;
    }
}

# Spoofed caller IDs (bank / agency numbers scammers fake)
$var(fcli) = $(fU{re.subst,/^[+]?1?([2-9][0-9]+)$/\1/});
if ($var(fcli) =~ "^[2-9][0-9]{9}$") {
    cache_raw_query("redis:sbc", "SISMEMBER sbc:block:cli $var(fcli)", "$avp(bcli)");
    if ($avp(bcli) == 1) {
        xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CLI cli=$var(fcli) dst=$rU src=$si\n");
        send_reply(403, "Forbidden");
        exit;
    }
}

# Whole source IP (manual only; ScamStop never adds these automatically by default)
cache_raw_query("redis:sbc", "SISMEMBER sbc:block:src $si", "$avp(bsrc)");
if ($avp(bsrc) == 1) {
    xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_SRC src=$si dst=$rU\n");
    send_reply(403, "Forbidden");
    exit;
}
