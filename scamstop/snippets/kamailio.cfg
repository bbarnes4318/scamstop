# ScamStop block checks for Kamailio 5.x. Needs ndb_redis, dialog, jsonrpcs (+ xhttp) and rtpengine:
#   loadmodule "ndb_redis.so"
#   modparam("ndb_redis", "server", "name=sbc;addr=127.0.0.1;port=6379;db=0")
#   loadmodule "xhttp.so"
#   loadmodule "jsonrpcs.so"
#   event_route[xhttp:request] { if ($hu =~ "^/RPC") { jsonrpc_dispatch(); exit; } }
# Call dlg_manage() on the initial INVITE so ScamStop can list and end the dialog.
# Then call route(SCAMSTOP) from request_route for initial INVITEs.

route[SCAMSTOP] {
    redis_cmd("sbc", "SISMEMBER sbc:dnc $rU", "r");
    if ($redis(r=>value) == 1) { xlog("L_WARN", "SCAMSTOP-REJECT reason=DNC dst=$rU src=$si\n"); sl_send_reply("403", "Destination Not Permitted"); exit; }
    redis_free("r");

    if ($ci =~ "^CNX[0-9]+_") {
        $var(ctag) = $(ci{re.subst,/^(CNX[0-9]+)_.*$/\1/});
        redis_cmd("sbc", "SISMEMBER sbc:block:tag $var(ctag)", "r");
        if ($redis(r=>value) == 1) { xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CENTER tag=$var(ctag)\n"); sl_send_reply("403", "Forbidden"); exit; }
        redis_free("r");
    }

    if (has_body("application/sdp")) {
        $var(cip) = $(rb{re.subst,/.*c=IN IP4 ([0-9.]+).*/\1/s});
        if ($var(cip) =~ "^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$") {
            redis_cmd("sbc", "SISMEMBER sbc:block:media $var(cip)", "r");
            if ($redis(r=>value) == 1) { xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CENTER media=$var(cip)\n"); sl_send_reply("403", "Forbidden"); exit; }
            redis_free("r");
        }
    }

    if ($ci =~ "@[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+") {
        $var(chost) = $(ci{re.subst,/^[^@]*@([0-9.]+).*$/\1/});
        redis_cmd("sbc", "SISMEMBER sbc:block:host $var(chost)", "r");
        if ($redis(r=>value) == 1) { xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CENTER host=$var(chost)\n"); sl_send_reply("403", "Forbidden"); exit; }
        redis_free("r");
    }

    $var(fcli) = $(fU{re.subst,/^[+]?1?([2-9][0-9]+)$/\1/});
    if ($var(fcli) =~ "^[2-9][0-9]{9}$") {
        redis_cmd("sbc", "SISMEMBER sbc:block:cli $var(fcli)", "r");
        if ($redis(r=>value) == 1) { xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_CLI cli=$var(fcli)\n"); sl_send_reply("403", "Forbidden"); exit; }
        redis_free("r");
    }

    redis_cmd("sbc", "SISMEMBER sbc:block:src $si", "r");
    if ($redis(r=>value) == 1) { xlog("L_WARN", "SCAMSTOP-REJECT reason=BLOCKED_SRC src=$si\n"); sl_send_reply("403", "Forbidden"); exit; }
    redis_free("r");
}
