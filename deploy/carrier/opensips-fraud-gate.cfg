# Carrier integration v1 (docs/carrier-integration-v1.md): switch-side fragments for the
# EXISTING carrier SBC (bbarnes4318/new-switch config/opensips-production.cfg, OpenSIPS 3.6).
# This is NOT a standalone config and does not replace anything: it adds three small pieces
# to the switch's own routes. It uses only what that config already uses and has verified
# live: cache_raw_query("redis:sbc", "EVAL \"...\" 0 ...") with the Lua inlined as ONE quoted
# token (no "$" and no double quotes inside it), $dlg_val(), $Ts, update_stat(), xlog().
#
# Nothing here writes to Redis. The switch only READS sbc:fraud:v1:deny:customer:<id>.
#
# Verify on the lab box before production, exactly as the switch README asks for any EVAL:
#   opensips -C -f /etc/opensips/opensips.cfg
#   opensips-cli -x mi dlg_list_ctx        # each dialog shows "values" incl. fa_v / fa_cust

# --- 0. declarations (top of file, with the other statistics) --------------------------------
modparam("statistics", "variable", "sbc:reject_fraud_deny")
modparam("statistics", "variable", "sbc:fraud_check_error")

# --- 1. route{} step 1: reset per request, next to the other $var() resets ---------------------
#     $var()s persist per worker process, so these MUST be reset on every request.
$var(fa_cust) = "";
$var(fa_parent) = "";

# --- 2. route[CUSTOMER_REGISTRY]: record who the call belongs to, then check deny records -----
#     (a) right after the FIRST route(CUSTOMER_LIMITS, $var(rec)):
#             $var(fa_cust) = $var(cid);
#             $var(fa_parent) = $(var(rec){s.select,7,|});   # reseller_id: new 8th field, see the doc
#     (b) inside "if ($var(pv) != "") {", BEFORE route(CUSTOMER_LIMITS, $var(t)) runs on the
#         child's record, the account resolved so far is the reseller:
#             $var(fa_parent) = $var(cid);
#         and AFTER it:
#             $var(fa_cust) = $var(cid);                     # the child placed this call
#     (c) just before "return(1);" at the end of route[CUSTOMER_REGISTRY]:
route(FRAUD_GATE);

# ARGV[1] = "c" + customer id, ARGV[2] = "p" + parent id ("p" alone = none), ARGV[3] = $Ts.
# The prefixes keep empty values from vanishing in cache_raw_query's whitespace split (the
# same trick as "x$rU" in CUSTOMER_REGISTRY). Ids are re-validated in Lua (digits, 1-18).
# Result: "ok~", "customer~<state>" or "parent~<state>".
route[FRAUD_GATE] {
    if ($var(fa_cust) == "") {
        return(1);
    }
    $avp(fd) = NULL;
    $var(rc) = cache_raw_query("redis:sbc", "EVAL \"local now = tonumber(ARGV[3]) or 0 local function denied(id) if #id < 1 or #id > 18 or string.find(id, '%D') then return '' end local h = redis.call('HMGET', 'sbc:fraud:v1:deny:customer:' .. id, 'state', 'expires_at') local st = h[1] local ex = tonumber(h[2] or '0') or 0 if (st == 'blocked' or st == 'quarantined') and (ex == 0 or ex > now) then return st end return '' end local a = denied(string.sub(ARGV[1], 2)) if a ~= '' then return 'customer~' .. a end local b = denied(string.sub(ARGV[2], 2)) if b ~= '' then return 'parent~' .. b end return 'ok~'\" 0 c$var(fa_cust) p$var(fa_parent) $Ts", "$avp(fd)");
    if ($var(rc) < 0 || $avp(fd) == NULL) {
        # Same policy as the registry itself: a Redis error fails OPEN at the switch. ScamStop
        # still ends active calls of denied customers on its next poll (its gatekeeper), and
        # reports fraud_store_errors / this stat.
        xlog("L_ERR", "SBC-FRAUD-ERROR rc=$var(rc) src=$si cid=$var(fa_cust) callid=$ci\n");
        update_stat("sbc:fraud_check_error", 1);
        return(1);
    }
    $var(fd) = $avp(fd);
    if ($(var(fd){s.select,0,~}) != "ok") {
        xlog("L_WARN", "SBC-REJECT reason=FRAUD_DENY who=$(var(fd){s.select,0,~}) state=$(var(fd){s.select,1,~}) cid=$var(fa_cust) parent=$var(fa_parent) src=$si callid=$ci\n");
        update_stat("sbc:reject_fraud_deny", 1);
        send_reply(403, "Forbidden");
        exit;
    }
    return(1);
}

# --- 3. route{} step 4: right after create_dialog("B") and the other $dlg_val() copies ---------
#     Trusted attribution for ScamStop (read back with MI dlg_list_ctx). Only written for calls
#     resolved through the registry; legacy-path calls carry no fa_v and are monitored without
#     any account-level action.
if ($var(fa_cust) != "") {
    $dlg_val(fa_v) = "1";
    $dlg_val(fa_cust) = $var(fa_cust);
    $dlg_val(fa_src) = $si;
    $dlg_val(fa_entry) = $socket_in(ip);
    if ($var(fa_parent) != "" && $var(fa_parent) != "-") {
        $dlg_val(fa_parent) = $var(fa_parent);
    }
    if ($var(endpoint) =~ "^pfx:[0-9]+:[0-9]+$") {
        $dlg_val(fa_ep) = $var(endpoint);
    }
}
