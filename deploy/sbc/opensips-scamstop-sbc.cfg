#
# ScamStop hosted SBC (OpenSIPS 3.2+). Companies point their dialer at this SBC;
# it accepts calls only from approved companies' IPs, rejects blocked sources,
# anchors media in rtpengine (so ScamStop can listen and warn), and relays each
# company's calls to the carrier it chose in the portal.
#
# ScamStop's portal writes the only two keys this reads per call:
#   sbc:cust:<source ip>   -> company id   (missing = not approved: 403)
#   sbc:route:<source ip>  -> carrier host:port
#
# Replace 203.0.113.5 with the SBC's public IP, then:
#   opensips -C -f this.cfg && systemctl restart opensips
# ScamStop connects over the MI FIFO below (platform: opensips, fifo: /run/opensips/opensips_fifo).

log_level=3
xlog_level=3
udp_workers=8
socket=udp:203.0.113.5:5060
server_header="Server: ScamStop SBC"
user_agent_header="User-Agent: ScamStop SBC"

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "proto_udp.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "signaling.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "dialog.so"
loadmodule "rtpengine.so"
loadmodule "cachedb_redis.so"
loadmodule "mi_fifo.so"

modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")
modparam("mi_fifo", "fifo_mode", 0660)
modparam("rr", "append_fromtag", 1)
modparam("dialog", "default_timeout", 14400)
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
modparam("cachedb_redis", "cachedb_url", "redis:sbc://127.0.0.1:6379/0")

route {
    if (!mf_process_maxfwd_header(10)) { send_reply(483, "Too Many Hops"); exit; }

    # in-dialog requests
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                rtpengine_delete();
            } else if (is_method("INVITE|UPDATE") && has_body("application/sdp")) {
                rtpengine_offer("replace-origin replace-session-connection");
                t_on_reply("REPLY");
            }
            t_relay();
            exit;
        }
        if (is_method("ACK")) { if (t_check_trans()) t_relay(); exit; }
        send_reply(404, "Not here");
        exit;
    }
    if (is_method("CANCEL")) { if (t_check_trans()) { rtpengine_delete(); t_relay(); } exit; }
    if (is_method("OPTIONS")) { send_reply(200, "OK"); exit; }
    if (!is_method("INVITE")) { send_reply(405, "Method Not Allowed"); exit; }
    t_check_trans();

    # 1. approved company?
    if (!cache_fetch("redis:sbc", "sbc:cust:$si", $var(tenant))) {
        xlog("L_WARN", "SCAMSTOP-SBC reject unknown source $si to $rU\n");
        send_reply(403, "Not authorized");
        exit;
    }

    # 2. blocked sources (ScamStop also ends these itself; this rejects them before they ring)
    route(BLOCKS);

    # 3. where this company's calls go
    if (!cache_fetch("redis:sbc", "sbc:route:$si", $var(route))) {
        send_reply(503, "No route configured");
        exit;
    }
    $ru = "sip:" + $rU + "@" + $var(route);

    create_dialog();
    record_route();
    if (has_body("application/sdp")) rtpengine_offer("replace-origin replace-session-connection");
    t_on_reply("REPLY");
    t_on_failure("FAIL");
    if (!t_relay()) send_reply(500, "Relay failed");
    exit;
}

route[BLOCKS] {
    $var(dst) = $(rU{re.subst,/^[+]?1?([2-9][0-9]{9})$/\1/});
    cache_raw_query("redis:sbc", "SISMEMBER sbc:dnc $var(dst)", "$avp(b)");
    if ($avp(b) == 1) { send_reply(403, "Destination Not Permitted"); exit; }
    if ($ci =~ "^CNX[0-9]+_") {
        $var(ctag) = $(ci{re.subst,/^(CNX[0-9]+)_.*$/\1/});
        cache_raw_query("redis:sbc", "SISMEMBER sbc:block:tag $var(ctag)", "$avp(b)");
        if ($avp(b) == 1) { route(NETBLOCK); exit; }
    }
    if ($ci =~ "@[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+") {
        $var(chost) = $(ci{re.subst,/^[^@]*@([0-9.]+).*$/\1/});
        cache_raw_query("redis:sbc", "SISMEMBER sbc:block:host $var(chost)", "$avp(b)");
        if ($avp(b) == 1) { route(NETBLOCK); exit; }
    }
    $var(fcli) = $(fU{re.subst,/^[+]?1?([2-9][0-9]+)$/\1/});
    if ($var(fcli) =~ "^[2-9][0-9]{9}$") {
        cache_raw_query("redis:sbc", "SISMEMBER sbc:block:cli $var(fcli)", "$avp(b)");
        if ($avp(b) == 1) { route(NETBLOCK); exit; }
    }
}

# Calls blocked because ScamStop flagged the source: SIP 603+ "Network Blocked" (ATIS-1000099,
# FCC 47 CFR 64.1200(k)(9)). This SBC is the first network the call enters, so location=LN.
# The tel= is where wrongly blocked callers ask for an unblock.
route[NETBLOCK] {
    xlog("L_WARN", "SCAMSTOP-SBC 603+ $si $fU -> $rU ci=$ci\n");
    append_to_reply("Reason: SIP;cause=603;text=\"v=analytics1;tel=+19045128487\";location=LN\r\n");
    send_reply(603, "Network Blocked");
    exit;
}

onreply_route[REPLY] {
    if (has_body("application/sdp")) rtpengine_answer("replace-origin replace-session-connection");
}

failure_route[FAIL] {
    if (t_was_cancelled()) exit;
    rtpengine_delete();
}
