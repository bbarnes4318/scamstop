#!KAMAILIO
#
# ScamStop hosted SBC (Kamailio 5.6+). Companies point their dialer at this SBC;
# it accepts calls only from approved companies' IPs, ends blocked sources at the
# door, anchors media in rtpengine (so ScamStop can listen and warn), and relays
# each company's calls to the carrier it chose in the portal.
#
# ScamStop's portal writes the only two keys this reads per call:
#   sbc:cust:<source ip>   -> company id   (missing = not approved: 403)
#   sbc:route:<source ip>  -> carrier host:port
#
# Set these three for your server, then: kamailio -c -f this.cfg && systemctl restart kamailio
#!substdef "!SBC_IP!203.0.113.5!g"
#!substdef "!SBC_PORT!5060!g"
#!substdef "!REDIS!127.0.0.1!g"

listen=udp:SBC_IP:SBC_PORT
listen=tcp:127.0.0.1:5071              # JSON-RPC for ScamStop (local only)
tcp_accept_no_cl=yes
children=8
log_facility=LOG_LOCAL0
user_agent_header="User-Agent: ScamStop SBC"
server_header="Server: ScamStop SBC"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "dialog.so"
loadmodule "rtpengine.so"
loadmodule "ndb_redis.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
loadmodule "ctl.so"

modparam("rr", "append_fromtag", 1)
modparam("dialog", "enable_stats", 1)
modparam("dialog", "default_timeout", 14400)
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
modparam("ndb_redis", "server", "name=sbc;addr=REDIS;port=6379;db=0")
modparam("jsonrpcs", "transport", 1)   # HTTP via xhttp

request_route {
    if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
    if (!sanity_check("1511", "7")) { exit; }

    if (is_method("OPTIONS") && uri==myself) { sl_send_reply("200", "OK"); exit; }

    # in-dialog requests
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) { rtpengine_delete(); }
            else if (is_method("INVITE|UPDATE") && has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection"); t_on_reply("REPLY"); }
            t_relay();
            exit;
        }
        if (is_method("ACK")) { if (t_check_trans()) { t_relay(); } exit; }
        sl_send_reply("404", "Not here");
        exit;
    }
    if (is_method("CANCEL")) { if (t_check_trans()) { rtpengine_delete(); t_relay(); } exit; }
    if (!is_method("INVITE")) { sl_send_reply("405", "Method Not Allowed"); exit; }
    t_check_trans();

    # 1. approved company?
    redis_cmd("sbc", "GET sbc:cust:$si", "c");
    if ($redis(c=>type) != 1) {
        xlog("L_WARN", "SCAMSTOP-SBC reject unknown source $si to $rU\n");
        sl_send_reply("403", "Not authorized");
        exit;
    }
    $dlg_var(tenant) = $redis(c=>value);

    # 2. blocked sources (ScamStop also ends these itself; this rejects them before they ring)
    route(BLOCKS);

    # 3. where this company's calls go
    redis_cmd("sbc", "GET sbc:route:$si", "r");
    if ($redis(r=>type) != 1) { sl_send_reply("503", "No route configured"); exit; }
    $ru = "sip:" + $rU + "@" + $redis(r=>value);

    dlg_manage();
    record_route();
    if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection"); }
    t_on_reply("REPLY");
    t_on_failure("FAIL");
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

route[BLOCKS] {
    redis_cmd("sbc", "SISMEMBER sbc:dnc $(rU{s.select,-1,+}{s.substr,-10,0})", "b");
    if ($redis(b=>value) == 1) { sl_send_reply("403", "Destination Not Permitted"); exit; }
    if ($ci =~ "^CNX[0-9]+_") {
        $var(ctag) = $(ci{re.subst,/^(CNX[0-9]+)_.*$/\1/});
        redis_cmd("sbc", "SISMEMBER sbc:block:tag $var(ctag)", "b");
        if ($redis(b=>value) == 1) { sl_send_reply("403", "Forbidden"); exit; }
    }
    if ($ci =~ "@[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+") {
        $var(chost) = $(ci{re.subst,/^[^@]*@([0-9.]+).*$/\1/});
        redis_cmd("sbc", "SISMEMBER sbc:block:host $var(chost)", "b");
        if ($redis(b=>value) == 1) { sl_send_reply("403", "Forbidden"); exit; }
    }
    $var(fcli) = $(fU{re.subst,/^[+]?1?([2-9][0-9]+)$/\1/});
    if ($var(fcli) =~ "^[2-9][0-9]{9}$") {
        redis_cmd("sbc", "SISMEMBER sbc:block:cli $var(fcli)", "b");
        if ($redis(b=>value) == 1) { sl_send_reply("403", "Forbidden"); exit; }
    }
}

onreply_route[REPLY] {
    if (has_body("application/sdp")) { rtpengine_manage("replace-origin replace-session-connection"); }
}

failure_route[FAIL] {
    if (t_is_canceled()) { exit; }
    rtpengine_delete();
}

event_route[xhttp:request] {
    if ($Rp == 5071 && $hu =~ "^/RPC") { jsonrpc_dispatch(); exit; }
    xhttp_reply("403", "Forbidden", "text/plain", "");
}
